name: Validate configs

on:
  push:
    paths:
      - "Chunlion_Rule-Set_DNS-Leak*.js"
      - "Chunlion_Rule-Set_DNS-Leak*.yaml"
      - "rules/**"
      - "scripts/validate.py"
      - "scripts/build_uk_banks.py"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "Chunlion_Rule-Set_DNS-Leak*.js"
      - "Chunlion_Rule-Set_DNS-Leak*.yaml"
      - "rules/**"
      - "scripts/validate.py"
      - "scripts/build_uk_banks.py"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC（北京时间 11:00）巡检规则源可达性
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m pip install -r requirements.txt
      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo MetaCubeX/mihomo --pattern 'mihomo-linux-amd64-compatible-*.gz' --output "$RUNNER_TEMP/mihomo.gz"
          gzip -d "$RUNNER_TEMP/mihomo.gz"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check compiled rule sets
        run: |
          for ruleset in rules/*.mrs; do
            python scripts/build_uk_banks.py --ruleset "$(basename "$ruleset" .mrs)" --check
          done
      - run: python scripts/validate.py
        if: github.event_name == 'push' || github.event_name == 'pull_request'
      - run: python scripts/validate.py --check-urls
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
